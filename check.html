<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>태블릿 점검</title>
<style>
body{font:16px/1.6 -apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;margin:0;padding:16px;background:#F6F8FB;color:#1B2A41}
h1{font-size:20px;margin:0 0 4px}
p{margin:0 0 12px;color:#64748B}
table{border-collapse:collapse;width:100%;background:#fff;border:1px solid #E3E9F2}
td{border-top:1px solid #E3E9F2;padding:8px 10px;vertical-align:top;word-break:break-all}
td.k{width:36%;font-weight:600}
.ok{color:#1D7A4D;font-weight:700}
.no{color:#C0392B;font-weight:700}
img.t{height:40px;vertical-align:middle;margin-left:6px}
iframe{display:block;width:100%;height:460px;border:1px solid #E3E9F2;background:#fff;margin-top:12px}
</style>
</head>
<body>
<h1>태블릿 점검</h1>
<p>6초쯤 기다렸다가 이 화면을 캡처해서 보내 주세요. 아래 실험 화면까지 한 장에 안 들어가면 두 장으로 나눠도 됩니다.</p>
<table id="t"></table>
<iframe id="app" src="./?check=1"></iframe>
<script>
/* ES5만 쓴다 — 아주 옛 브라우저에서도 이 점검은 돌아야 한다 */
(function(){
  var t = document.getElementById('t');
  function row(k, v, ok){
    var tr = t.insertRow(-1), a = tr.insertCell(0), c = tr.insertCell(1);
    a.className = 'k'; a.textContent = k;
    if(ok === true || ok === false){ var s = document.createElement('span'); s.className = ok ? 'ok' : 'no'; s.textContent = ok ? '됨 ' : '안 됨 '; c.appendChild(s); }
    if(v) c.appendChild(document.createTextNode(v));
    return c;
  }
  function css(p, v){ try { return !!(window.CSS && CSS.supports && CSS.supports(p, v)); } catch(e){ return false; } }
  function js(code){ try { new Function(code); return true; } catch(e){ return false; } }
  row('브라우저 정보', navigator.userAgent);
  row('화면 크기', window.innerWidth + ' × ' + window.innerHeight + ' · 배율 ' + (window.devicePixelRatio || 1));
  row('CSS 변수', '', css('--a', '0'));
  row('CSS Grid', '', css('display', 'grid'));
  row('aspect-ratio', '', css('aspect-ratio', '1 / 1'));
  row('inset', '', css('inset', '0'));
  row('clamp()', '', css('width', 'clamp(1px, 2px, 3px)'));
  row('dvh', '', css('height', '1dvh'));
  row('ES6 문법(화살표 함수 등)', '', js('const a = (x) => `${x}`; let [b] = [...[1]]; class C {}'));
  row('ResizeObserver', '', !!window.ResizeObserver);
  row('PointerEvent(끌기)', '', !!window.PointerEvent);
  function img(label, src){
    var c = row(label, '확인 중…'), im = new Image();
    im.onload = function(){ c.textContent = ''; var s = document.createElement('span'); s.className = 'ok'; s.textContent = '됨 ' + im.naturalWidth + '×' + im.naturalHeight; c.appendChild(s); im.className = 't'; c.appendChild(im); };
    im.onerror = function(){ c.textContent = ''; var s = document.createElement('span'); s.className = 'no'; s.textContent = '안 됨'; c.appendChild(s); };
    im.src = src + '?c=' + new Date().getTime();
  }
  img('WebP 그림', 'assets/bg-lab.webp');
  img('JPG 그림', 'assets/bg-lab.jpg');
  var appRow = row('실험 화면(아래)', '6초 뒤에 확인합니다…');
  setTimeout(function(){
    try {
      var w = document.getElementById('app').contentWindow, d = w.document;
      var st = d.getElementById('stage') || d.getElementById('stage1');
      var parts = [];
      if(st){
        var r = st.getBoundingClientRect(), imgs = st.getElementsByTagName('img'), shown = 0, names = [];
        for(var i = 0; i < imgs.length; i++){ if(imgs[i].naturalWidth > 0) shown++; names.push((imgs[i].currentSrc || imgs[i].src).split('/').pop().split('?')[0]); }
        parts.push('실험대 ' + Math.round(r.width) + '×' + Math.round(r.height));
        parts.push('그림 ' + shown + '/' + imgs.length + ' 표시');
        parts.push('파일 ' + names.slice(0, 2).join(', '));
      } else parts.push('실험대를 찾지 못함');
      parts.push('대비 코드 ' + (typeof w.useFallbackImages === 'function' ? '있음' : '없음(예전 화면)'));
      parts.push('오류 ' + ((w.__appErrors && w.__appErrors.length) ? w.__appErrors.join(' | ') : '없음'));
      appRow.textContent = parts.join(' · ');
    } catch(e){ appRow.textContent = '확인 실패: ' + e.message; }
  }, 6000);
})();
</script>
</body>
</html>
